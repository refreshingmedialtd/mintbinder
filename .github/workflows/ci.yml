name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mintbinder_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mintbinder_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTH_SECRET: ci-only-auth-secret-that-is-at-least-32-characters
      AUTH_TRUST_HOST: "true"
      AUTH_URL: http://127.0.0.1:3000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mintbinder_ci
      JOB_SECRET: ci-only-job-secret-that-is-at-least-32-characters
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply complete migration chain to PostgreSQL
        run: npm run db:deploy

      - name: Run required project checks
        run: npm run ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
