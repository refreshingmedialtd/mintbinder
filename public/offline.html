<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#101923" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"
    />
    <title>Mint Binder is offline</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); background: #090e16; color: #f8fafc; }
      main { width: min(100%, 440px); padding: 28px; border: 1px solid #34475f; border-radius: 16px; background: #101823; box-shadow: 0 24px 64px rgba(0, 0, 0, .32); text-align: center; }
      img { width: 80px; height: 80px; margin: 0 auto 18px; }
      h1 { margin: 0 0 10px; font-size: 26px; }
      p { margin: 0 0 22px; color: #b7c4d6; line-height: 1.55; }
      a { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; padding: 10px 18px; border-radius: 10px; background: #8b5cf6; color: white; font-weight: 800; text-decoration: none; }
      a:focus-visible { outline: 3px solid #22d3ee; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="80" height="80" />
      <h1>You’re offline</h1>
      <p>Mint Binder could not reach the server. Your account data has not been cached on this device. Reconnect, then try again.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
